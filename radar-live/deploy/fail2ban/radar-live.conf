# fail2ban filter for the radar-live security log (docs/security/logging.md).
# Install as /etc/fail2ban/filter.d/radar-live.conf (install.sh --with-fail2ban does it).
# Test it:  fail2ban-regex /var/log/radar/security.log radar-live
#
# One JSON object per line with a fixed field order: ts, event, ip, class, reason, count. Only a failed key
# and a rate-limit hit count as a failure; bans, validation rejects and housekeeping events do not.
# The address group is anchored right after "event", so no later field can fake a host.
[Definition]
failregex = ^\{"ts":"[^"]+","event":"(?:auth_failure|rate_limited)","ip":"<HOST>"
ignoreregex =
